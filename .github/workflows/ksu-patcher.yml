name: "KSU Boot Patcher - Multi Manager + SUSFS"

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: "Direct link to boot.img or firmware.zip"
        required: true
        type: string
      zip_boot_path:
        description: "Path to boot.img inside ZIP (empty = auto)"
        required: false
        type: string
      gki_source:
        description: "Kernel source"
        required: true
        default: "WildKernels"
        type: choice
        options:
          - "WildKernels"
          - "zzh20188"
          - "zzh20188-ReSukiSU"
          - "KernelSU-Next"
          - "Stock-Boot"
      wifi_fix_mode:
        description: "WiFi safety policy for 6.12.x"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "strict"
          - "off"
      include_susfs_module:
        description: "Download SUSFS userspace module"
        required: false
        type: boolean
        default: true
      include_zygisk:
        description: "Download ZygiskNext + Shamiko"
        required: false
        type: boolean
        default: false
      include_lsposed:
        description: "Download LSPosed"
        required: false
        type: boolean
        default: false

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Download input
        run: |
          set -e
          curl -L --progress-bar "${{ inputs.boot_img_url }}" -o input_file
          ls -lh input_file
          file input_file
          [ "$(stat -c%s input_file)" -ge 1000000 ] || { echo "::error::Input too small (< 1 MB)"; exit 1; }

      - name: Extract boot.img
        run: |
          set -e
          rm -rf ex
          mkdir -p ex

          if file input_file | grep -qiE 'zip|archive'; then
            if [ -n "${{ inputs.zip_boot_path }}" ]; then
              unzip -j input_file "${{ inputs.zip_boot_path }}" -d ex/ || { echo "::error::zip_boot_path not found"; exit 1; }
            else
              BOOT_PATH=$(unzip -l input_file | awk '{print $4}' \
                | grep -i 'boot\.img$' \
                | grep -ivE 'vendor_boot|init_boot|recovery|vbmeta|super' \
                | head -1 || true)
              if [ -z "$BOOT_PATH" ]; then
                BOOT_PATH=$(unzip -l input_file | awk '{print $4}' | grep -i '^boot' | head -1 || true)
              fi
              [ -n "$BOOT_PATH" ] || { echo "::error::Cannot auto-find boot.img"; exit 1; }
              unzip -j input_file "$BOOT_PATH" -d ex/
            fi

            IMG_FOUND=$(find ex -type f -name '*.img' | head -1 || true)
            [ -n "$IMG_FOUND" ] || { echo "::error::No .img extracted"; exit 1; }
            mv "$IMG_FOUND" boot.img
          else
            mv input_file boot.img
          fi

          file boot.img
          ls -lh boot.img

      - name: Setup magiskboot
        run: |
          set -e
          curl -sL "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -o magisk.apk || true
          if [ "$(stat -c%s magisk.apk 2>/dev/null || echo 0)" -lt 100000 ]; then
            APK=$(curl -sf https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
              | jq -r '.assets[] | select(.name | test("^Magisk-v[0-9].*\\.apk$")) | .browser_download_url' \
              | head -1)
            [ -n "$APK" ] && [ "$APK" != "null" ] || { echo "::error::Cannot find Magisk APK"; exit 1; }
            curl -sL "$APK" -o magisk.apk
          fi
          unzip -jq magisk.apk "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Unpack boot and detect kernel
        run: |
          set -e
          mkdir -p workspace out modules managers report candidates
          cp boot.img workspace/
          cd workspace
          ../magiskboot unpack boot.img

          KFILE=$(find . -maxdepth 1 \( -name kernel -o -name Image -o -name kernel.gz -o -name kernel_dtb -o -name kernel-dtb \) | head -1)
          [ -n "$KFILE" ] || { echo "::error::No kernel file found"; exit 1; }

          KTARGET="$KFILE"
          if file "$KFILE" | grep -qiE 'gzip|lz4|lzma|compressed'; then
            ../magiskboot decompress "$KFILE" kfile_dec 2>/dev/null || true
            [ -s kfile_dec ] && KTARGET="kfile_dec"
          fi

          FULL=$(strings "$KTARGET" 2>/dev/null | grep -oP 'Linux version \K[^\s]+' | head -1 || true)
          if [ -n "$FULL" ]; then
            KVER=$(echo "$FULL" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+' || true)
            KSHORT=$(echo "$FULL" | grep -oP '^[0-9]+\.[0-9]+' || true)
            ANDROID=$(echo "$FULL" | grep -oP 'android[0-9]+' | head -1 || true)
            KMI="${KSHORT}-${ANDROID}"
          else
            KVER="unknown"; KSHORT="unknown"; ANDROID="unknown"; KMI="unknown"
          fi

          KMAJOR=$(echo "$KVER" | cut -d. -f1 || echo 0)
          KMINOR=$(echo "$KVER" | cut -d. -f2 || echo 0)
          NEED_WIFI_FIX="no"
          if [ "$KMAJOR" = "6" ] && [ "$KMINOR" = "12" ]; then
            NEED_WIFI_FIX="yes"
          fi

          cd ..
          echo "KFILE=$KFILE" >> "$GITHUB_ENV"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KSHORT=$KSHORT" >> "$GITHUB_ENV"
          echo "ANDROID=$ANDROID" >> "$GITHUB_ENV"
          echo "KMI=$KMI" >> "$GITHUB_ENV"
          echo "KMAJOR=$KMAJOR" >> "$GITHUB_ENV"
          echo "KMINOR=$KMINOR" >> "$GITHUB_ENV"
          echo "NEED_WIFI_FIX=$NEED_WIFI_FIX" >> "$GITHUB_ENV"

          echo "Detected Kernel: KVER=$KVER, KSHORT=$KSHORT, ANDROID=$ANDROID, KMI=$KMI"

      - name: Select source config
        run: |
          set -e
          SOURCE="${{ inputs.gki_source }}"
          case "$SOURCE" in
            WildKernels)
              echo "SRC_REPO=WildKernels/GKI_KernelSU_SUSFS" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=false" >> "$GITHUB_ENV"
              echo "MGR1_REPO=WildKernels/Wild_KSU" >> "$GITHUB_ENV"
              echo "MGR1_NAME=WildKSU_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR2_NAME=KernelSU-Next_Manager" >> "$GITHUB_ENV"
              ;;
            zzh20188)
              echo "SRC_REPO=zzh20188/GKI_KernelSU_SUSFS" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=false" >> "$GITHUB_ENV"
              echo "MGR1_REPO=SukiSU-Ultra/SukiSU-Ultra" >> "$GITHUB_ENV"
              echo "MGR1_NAME=SukiSU_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR2_NAME=KernelSU-Next_Manager" >> "$GITHUB_ENV"
              ;;
            zzh20188-ReSukiSU)
              echo "SRC_REPO=zzh20188/GKI_KernelSU_SUSFS" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=true" >> "$GITHUB_ENV"
              echo "MGR1_REPO=" >> "$GITHUB_ENV"
              echo "MGR1_NAME=ReSukiSU_Manager_Normal" >> "$GITHUB_ENV"
              echo "MGR2_REPO=" >> "$GITHUB_ENV"
              echo "MGR2_NAME=ReSukiSU_Manager_Spoofed" >> "$GITHUB_ENV"
              ;;
            KernelSU-Next|Stock-Boot)
              echo "SRC_REPO=" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=false" >> "$GITHUB_ENV"
              echo "MGR1_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR1_NAME=KernelSU-Next_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=" >> "$GITHUB_ENV"
              echo "MGR2_NAME=" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Prepare candidate list
        if: >
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'zzh20188-ReSukiSU'
        run: |
          set -e

          REPO="$SRC_REPO"
          USE_PRE="$SRC_USE_PRERELEASE"

          ALL_RELEASES=$(curl -sf "https://api.github.com/repos/${REPO}/releases?per_page=10")
          if [ "$USE_PRE" = "true" ]; then
            RELEASE=$(echo "$ALL_RELEASES" | jq 'map(select(.prerelease == true)) | .[0]')
          else
            RELEASE=$(echo "$ALL_RELEASES" | jq 'map(select(.prerelease == false)) | .[0]')
          fi

          RELEASE_TAG=$(echo "$RELEASE" | jq -r '.tag_name // "unknown"')
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Selected release: $RELEASE_TAG"

          echo "$RELEASE" > release.json
          echo "=== Assets ==="
          jq -r '.assets[] | .name' release.json || true

          rm -f candidates/urls.txt
          touch candidates/urls.txt

          jq -r --arg kv "$KVER" --arg an "$ANDROID" '
            .assets[]
            | select(
                (.name | ascii_downcase | contains("anykernel3")) and
                (.name | contains($kv)) and
                (.name | ascii_downcase | contains($an)) and
                (.name | endswith(".zip"))
              )
            | .browser_download_url
          ' release.json >> candidates/urls.txt

          jq -r --arg ks "$KSHORT" --arg an "$ANDROID" '
            .assets[]
            | select(
                (.name | ascii_downcase | contains("anykernel3")) and
                (.name | contains($ks)) and
                (.name | ascii_downcase | contains($an)) and
                (.name | endswith(".zip"))
              )
            | .browser_download_url
          ' release.json >> candidates/urls.txt

          jq -r '
            .assets[]
            | select((.name | ascii_downcase | contains("anykernel3")) and (.name | endswith(".zip")))
            | .browser_download_url
          ' release.json >> candidates/urls.txt

          awk 'NF' candidates/urls.txt | awk '!seen[$0]++' > candidates/urls_clean.txt
          mv candidates/urls_clean.txt candidates/urls.txt

          [ -s candidates/urls.txt ] || { echo "::error::No candidate URLs found"; exit 1; }

          echo "=== Candidate URLs ==="
          nl -ba candidates/urls.txt

      - name: Select best kernel candidate (SUSFS + WiFi scoring)
        if: >
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'zzh20188-ReSukiSU'
        run: |
          set -e

          BEST_SCORE=-1
          BEST_URL=""
          BEST_IMG=""
          BEST_SUSFS="no"
          BEST_WIFI="no"
          i=0

          need_wifi="no"
          if [ "$NEED_WIFI_FIX" = "yes" ] && [ "${{ inputs.wifi_fix_mode }}" != "off" ]; then
            need_wifi="yes"
          fi

          while IFS= read -r URL; do
            i=$((i+1))
            [ -n "$URL" ] || continue

            CZIP="candidates/cand_${i}.zip"
            CDIR="candidates/cand_${i}"
            CIMG=""

            rm -rf "$CDIR"
            mkdir -p "$CDIR"

            echo "--- Candidate #$i ---"
            echo "URL: $URL"
            curl -L --progress-bar "$URL" -o "$CZIP"
            [ -s "$CZIP" ] || { echo "empty download, skip"; continue; }

            unzip -q "$CZIP" -d "$CDIR" || { echo "unzip failed, skip"; continue; }

            CIMG=$(find "$CDIR" -type f \( -name Image -o -name Image.gz -o -name Image.lz4 -o -name kernel \) | head -1 || true)
            [ -n "$CIMG" ] || { echo "no kernel image, skip"; continue; }

            OUTK="candidates/out_${i}.img"
            if file "$CIMG" | grep -qi gzip; then
              gunzip -c "$CIMG" > "$OUTK" || cp "$CIMG" "$OUTK"
            elif file "$CIMG" | grep -qi lz4; then
              ./magiskboot decompress "$CIMG" "$OUTK" 2>/dev/null || cp "$CIMG" "$OUTK"
            else
              cp "$CIMG" "$OUTK"
            fi
            [ -s "$OUTK" ] || { echo "failed to extract image, skip"; continue; }

            SCORE=0
            HAS_SUSFS="no"
            HAS_WIFI="no"

            if strings "$OUTK" 2>/dev/null | grep -Eiq 'susfs|ksu_susfs|sus_su'; then
              HAS_SUSFS="yes"
              SCORE=$((SCORE+60))
            fi

            if strings "$OUTK" 2>/dev/null | grep -Eiq 'cfg80211|mac80211|ath10k|ath11k|mt76|wlan|wcn'; then
              HAS_WIFI="yes"
              SCORE=$((SCORE+40))
            fi

            if echo "$URL" | grep -qi "$KVER"; then
              SCORE=$((SCORE+25))
            elif echo "$URL" | grep -qi "$KSHORT"; then
              SCORE=$((SCORE+15))
            fi

            if echo "$URL" | grep -Eiq 'wifi|wlan|ath|mt76|cfg80211|mac80211|fix'; then
              SCORE=$((SCORE+10))
            fi

            if [ "${{ inputs.gki_source }}" = "zzh20188-ReSukiSU" ] && echo "$URL" | grep -Eiq 'resukisu|sukisu'; then
              SCORE=$((SCORE+10))
            fi

            echo "score=$SCORE susfs=$HAS_SUSFS wifi=$HAS_WIFI"

            if [ "$HAS_SUSFS" != "yes" ]; then
              echo "skip: SUSFS missing"
              continue
            fi

            if [ "$need_wifi" = "yes" ] && [ "${{ inputs.wifi_fix_mode }}" = "strict" ] && [ "$HAS_WIFI" != "yes" ]; then
              echo "skip: strict mode requires WiFi symbols"
              continue
            fi

            if [ "$SCORE" -gt "$BEST_SCORE" ]; then
              BEST_SCORE="$SCORE"
              BEST_URL="$URL"
              BEST_IMG="$OUTK"
              BEST_SUSFS="$HAS_SUSFS"
              BEST_WIFI="$HAS_WIFI"
            fi
          done < candidates/urls.txt

          [ -n "$BEST_IMG" ] || { echo "::error::No valid kernel candidate found with SUSFS"; exit 1; }
          cp "$BEST_IMG" out/Image

          WIFI_SAFE="unknown"
          if [ "$NEED_WIFI_FIX" = "yes" ]; then
            if [ "$BEST_WIFI" = "yes" ]; then
              WIFI_SAFE="yes"
            else
              WIFI_SAFE="check_release"
            fi
          else
            WIFI_SAFE="yes"
          fi

          echo "BEST_URL=$BEST_URL" >> "$GITHUB_ENV"
          echo "BEST_SCORE=$BEST_SCORE" >> "$GITHUB_ENV"
          echo "SUSFS_KERNEL=$BEST_SUSFS" >> "$GITHUB_ENV"
          echo "WIFI_SAFE=$WIFI_SAFE" >> "$GITHUB_ENV"

          echo "Selected candidate: $BEST_URL"
          echo "score=$BEST_SCORE susfs=$BEST_SUSFS wifi=$BEST_WIFI"

      - name: Repack with selected kernel
        if: >
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'zzh20188-ReSukiSU'
        run: |
          set -e
          [ -s out/Image ] || { echo "::error::out/Image missing"; exit 1; }
          KFILE_BASE=$(basename "$KFILE")
          cd workspace
          cp ../out/Image "$KFILE_BASE"
          ../magiskboot repack boot.img ../patched_boot.img
          cd ..
          [ -s patched_boot.img ] || { echo "::error::patched_boot.img missing"; exit 1; }

      - name: Repack stock kernel (Stock-Boot / KernelSU-Next)
        if: >
          inputs.gki_source == 'Stock-Boot' ||
          inputs.gki_source == 'KernelSU-Next'
        run: |
          set -e
          KFILE_BASE=$(basename "$KFILE")
          cp "workspace/$KFILE_BASE" out/Image
          cd workspace
          ../magiskboot repack boot.img ../patched_boot.img
          cd ..
          [ -s patched_boot.img ] || { echo "::error::patched_boot.img missing"; exit 1; }
          echo "SUSFS_KERNEL=no" >> "$GITHUB_ENV"
          echo "WIFI_SAFE=yes" >> "$GITHUB_ENV"

      - name: Build AnyKernel3 flashable zip
        run: |
          set -e
          [ -s out/Image ] || { echo "::error::out/Image missing"; exit 1; }
          rm -rf AnyKernel3-master ak3.zip Flashable_AnyKernel3.zip
          curl -fL "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip" -o ak3.zip
          unzip -q ak3.zip
          AK3="AnyKernel3-master"
          cp out/Image "$AK3/Image"
          perl -0777 -i -pe '
            s/^block=.*/block=boot/m;
            s/^is_slot_device=.*/is_slot_device=auto/m;
            s/^do\.devicecheck=.*/do.devicecheck=0/m;
            s/^do\.modules=.*/do.modules=0/m;
            s/^kernel\.string=.*/kernel.string=KSU Boot Patcher Ultimate/m;
          ' "$AK3/anykernel.sh"
          (cd "$AK3" && zip -r9 ../Flashable_AnyKernel3.zip . -x ".git/*" ".github/*" "*.md")
          [ -s Flashable_AnyKernel3.zip ] || { echo "::error::AK3 zip not created"; exit 1; }

      - name: Verify kernel flags and write report
        run: |
          set -e
          FINAL_SUSFS="no"
          FINAL_WIFI="no"
          if strings out/Image 2>/dev/null | grep -Eiq 'susfs|ksu_susfs|sus_su'; then FINAL_SUSFS="yes"; fi
          if strings out/Image 2>/dev/null | grep -Eiq 'cfg80211|mac80211|ath10k|ath11k|mt76|wlan|wcn'; then FINAL_WIFI="yes"; fi

          echo "FINAL_SUSFS=$FINAL_SUSFS" >> "$GITHUB_ENV"
          echo "FINAL_WIFI=$FINAL_WIFI" >> "$GITHUB_ENV"

          if [ "$FINAL_SUSFS" != "yes" ] && [ "${{ inputs.gki_source }}" != "Stock-Boot" ] && [ "${{ inputs.gki_source }}" != "KernelSU-Next" ]; then
            echo "::error::Selected kernel does not expose SUSFS strings"
            exit 1
          fi

          if [ "$NEED_WIFI_FIX" = "yes" ] && [ "${{ inputs.wifi_fix_mode }}" = "strict" ] && [ "$FINAL_WIFI" != "yes" ]; then
            echo "::error::Strict WiFi mode enabled but WiFi symbols not detected"
            exit 1
          fi

          mkdir -p report
          {
            echo "KSU Boot Patcher Report"
            echo "======================="
            echo "Source          : ${{ inputs.gki_source }}"
            echo "Kernel version  : $KVER"
            echo "KMI             : $KMI"
            echo "Release tag     : ${RELEASE_TAG:-N/A}"
            echo "Best URL        : ${BEST_URL:-N/A}"
            echo "Best score      : ${BEST_SCORE:-N/A}"
            echo "SUSFS (selected): ${SUSFS_KERNEL:-N/A}"
            echo "WiFi safe       : ${WIFI_SAFE:-N/A}"
            echo "SUSFS (final)   : $FINAL_SUSFS"
            echo "WiFi (final)    : $FINAL_WIFI"
          } > report/patch_report.txt
          cat report/patch_report.txt

      - name: Create root boot flasher script
        run: |
          cat > flash_boot_root.sh << 'SCRIPT_EOF'
          #!/system/bin/sh
          set -e
          IMG="$1"
          if [ -z "$IMG" ] || [ ! -f "$IMG" ]; then
            echo "Usage: sh flash_boot_root.sh /path/to/patched_boot.img"
            exit 1
          fi

          SLOT="$(getprop ro.boot.slot_suffix 2>/dev/null || true)"
          TARGET=""
          for p in \
            "/dev/block/by-name/boot${SLOT}" \
            "/dev/block/bootdevice/by-name/boot${SLOT}" \
            "/dev/block/by-name/boot" \
            "/dev/block/bootdevice/by-name/boot"; do
            [ -e "$p" ] && TARGET="$p" && break
          done

          if [ -z "$TARGET" ]; then
            for p in /dev/block/platform/*/by-name/boot${SLOT} /dev/block/platform/*/by-name/boot; do
              [ -e "$p" ] && TARGET="$p" && break
            done
          fi

          [ -n "$TARGET" ] || { echo "ERROR: Cannot locate boot partition"; exit 1; }

          echo "Target: $TARGET"
          echo "Image : $IMG"
          dd if="$IMG" of="$TARGET" bs=4096
          sync
          echo "Done. Reboot now."
          SCRIPT_EOF
          chmod +x flash_boot_root.sh

      - name: Download Manager APKs (normal sources)
        if: >
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'KernelSU-Next' ||
          inputs.gki_source == 'Stock-Boot'
        run: |
          set -e
          mkdir -p managers

          download_apk() {
            local REPO="$1"
            local NAME="$2"
            [ -z "$REPO" ] && return 0
            URL=$(curl -sf "https://api.github.com/repos/${REPO}/releases/latest" \
              | jq -r '[.assets[] | select(.name | endswith(".apk"))] | sort_by(.size) | reverse | .[0].browser_download_url' || true)
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              curl -sL "$URL" -o "managers/${NAME}.apk"
            else
              echo "::warning::No APK for $REPO"
            fi
          }

          download_apk "$MGR1_REPO" "$MGR1_NAME"
          download_apk "$MGR2_REPO" "$MGR2_NAME"

      - name: Download ReSukiSU Manager APKs
        if: inputs.gki_source == 'zzh20188-ReSukiSU'
        run: |
          set -e
          mkdir -p managers

          ALL_RELEASES=$(curl -sf "https://api.github.com/repos/zzh20188/GKI_KernelSU_SUSFS/releases?per_page=10")
          RELEASE_JSON=$(echo "$ALL_RELEASES" | jq 'map(select(.prerelease == true)) | .[0]')

          NORMAL_URL=$(echo "$RELEASE_JSON" | jq -r '[.assets[] | select((.name | endswith(".apk")) and (.name | test("ReSukiSU";"i")) and (.name | test("spoofed")|not) and (.name | test("debug")|not) and (.name | test("universal";"i"))) | .browser_download_url] | .[0]' || true)
          if [ -z "$NORMAL_URL" ] || [ "$NORMAL_URL" = "null" ]; then
            NORMAL_URL=$(echo "$RELEASE_JSON" | jq -r '[.assets[] | select((.name | endswith(".apk")) and (.name | test("ReSukiSU";"i")) and (.name | test("spoofed")|not) and (.name | test("debug")|not) and (.name | test("arm64";"i"))) | .browser_download_url] | .[0]' || true)
          fi
          [ -n "$NORMAL_URL" ] && [ "$NORMAL_URL" != "null" ] && curl -sL "$NORMAL_URL" -o managers/ReSukiSU_Manager_Normal.apk || true

          SPOOFED_URL=$(echo "$RELEASE_JSON" | jq -r '[.assets[] | select((.name | endswith(".apk")) and (.name | test("ReSukiSU";"i")) and (.name | test("spoofed";"i")) and (.name | test("debug")|not) and (.name | test("universal";"i"))) | .browser_download_url] | .[0]' || true)
          if [ -z "$SPOOFED_URL" ] || [ "$SPOOFED_URL" = "null" ]; then
            SPOOFED_URL=$(echo "$RELEASE_JSON" | jq -r '[.assets[] | select((.name | endswith(".apk")) and (.name | test("ReSukiSU";"i")) and (.name | test("spoofed";"i")) and (.name | test("debug")|not) and (.name | test("arm64";"i"))) | .browser_download_url] | .[0]' || true)
          fi
          if [ -n "$SPOOFED_URL" ] && [ "$SPOOFED_URL" != "null" ]; then
            curl -sL "$SPOOFED_URL" -o managers/ReSukiSU_Manager_Spoofed.apk
            echo "RESUKISU_SPOOFED_FOUND=yes" >> "$GITHUB_ENV"
          else
            echo "RESUKISU_SPOOFED_FOUND=no" >> "$GITHUB_ENV"
          fi

      - name: Download SUSFS module
        if: >
          inputs.include_susfs_module == true ||
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'zzh20188-ReSukiSU'
        run: |
          set -e
          mkdir -p modules

          URL=$(curl -sf https://api.github.com/repos/sidex15/ksu_module_susfs/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' \
            | head -1 || true)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            ALL_REL=$(curl -sf "https://api.github.com/repos/zzh20188/GKI_KernelSU_SUSFS/releases?per_page=10")
            if [ "$SRC_USE_PRERELEASE" = "true" ]; then
              REL_J=$(echo "$ALL_REL" | jq 'map(select(.prerelease==true)) | .[0]')
            else
              REL_J=$(echo "$ALL_REL" | jq 'map(select(.prerelease==false)) | .[0]')
            fi
            URL=$(echo "$REL_J" | jq -r '.assets[] | select(.name | test("ksu_module_susfs|susfs.*\\.zip"; "i")) | .browser_download_url' | head -1 || true)
          fi

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            URL=$(curl -sf https://api.github.com/repos/SukiSU-Ultra/SukiSU_module/releases/latest \
              | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' \
              | head -1 || true)
          fi

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            URL="https://github.com/sidex15/ksu_module_susfs/releases/download/v1.5.2/ksu_module_susfs_v1.5.2.zip"
          fi

          curl -sL "$URL" -o modules/ksu_module_susfs.zip
          [ -s modules/ksu_module_susfs.zip ] || { echo "::error::SUSFS module download failed"; exit 1; }
          echo "SUSFS_MODULE=yes" >> "$GITHUB_ENV"

      - name: Download ZygiskNext + Shamiko
        if: inputs.include_zygisk == true
        run: |
          set -e
          mkdir -p modules
          Z=$(curl -sf https://api.github.com/repos/Dr-TSNG/ZygiskNext/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' \
            | head -1 || true)
          [ -n "$Z" ] && [ "$Z" != "null" ] || Z="https://github.com/Dr-TSNG/ZygiskNext/releases/download/v1.1.0/ZygiskNext-v1.1.0.zip"
          curl -sL "$Z" -o modules/ZygiskNext.zip

          S=$(curl -sf https://api.github.com/repos/LSPosed/LSPosed.github.io/releases/latest \
            | jq -r '.assets[] | select(.name | test("[Ss]hamiko")) | .browser_download_url' \
            | head -1 || true)
          [ -n "$S" ] && [ "$S" != "null" ] || S="https://github.com/LSPosed/LSPosed.github.io/releases/latest/download/Shamiko-release.zip"
          curl -sL "$S" -o modules/Shamiko.zip

      - name: Download LSPosed
        if: inputs.include_lsposed == true
        run: |
          set -e
          mkdir -p modules
          URL=$(curl -sf https://api.github.com/repos/LSPosed/LSPosed/releases/latest \
            | jq -r '.assets[] | select(.name | test("[Ll][Ss][Pp]osed.*[Zz]ygisk")) | .browser_download_url' \
            | head -1 || true)
          [ -n "$URL" ] && [ "$URL" != "null" ] || URL="https://github.com/LSPosed/LSPosed/releases/latest/download/LSPosed-zygisk-release.zip"
          curl -sL "$URL" -o modules/LSPosed.zip

      - name: Upload main artifact
        uses: actions/upload-artifact@v4
        with:
          name: "KSU [${{ inputs.gki_source }}] [${{ env.KMI }}]"
          path: |
            patched_boot.img
            Flashable_AnyKernel3.zip
            flash_boot_root.sh
            managers/
            report/patch_report.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Upload modules artifact
        if: >
          inputs.include_susfs_module == true ||
          inputs.include_zygisk == true ||
          inputs.include_lsposed == true ||
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'zzh20188-ReSukiSU'
        uses: actions/upload-artifact@v4
        with:
          name: "KSU-Modules [${{ inputs.gki_source }}]"
          path: modules/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GoFile
        run: |
          set +e
          upload_gofile() {
            local FILE="$1"
            local LABEL="$2"
            [ -f "$FILE" ] || return
            SERVER=$(curl -sf https://api.gofile.io/servers | jq -r '.data.servers[0].name' 2>/dev/null || true)
            [ -n "$SERVER" ] && [ "$SERVER" != "null" ] || return
            RESP=$(curl -sf -F "file=@${FILE}" "https://${SERVER}.gofile.io/uploadFile" 2>/dev/null || true)
            LINK=$(echo "$RESP" | jq -r '.data.downloadPage' 2>/dev/null || true)
            [ -n "$LINK" ] && [ "$LINK" != "null" ] && echo "GOFILE_LINK_${LABEL}=${LINK}" >> "$GITHUB_ENV"
          }
          upload_gofile "patched_boot.img" "BOOT"
          upload_gofile "Flashable_AnyKernel3.zip" "ANYKERNEL3"
          upload_gofile "flash_boot_root.sh" "ROOT_SCRIPT"
          upload_gofile "modules/ksu_module_susfs.zip" "SUSFS_MODULE"

      - name: Summary
        if: always()
        run: |
          {
            echo "## KSU Boot Patcher Result"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Source | \`${{ inputs.gki_source }}\` |"
            echo "| Kernel Version | \`${KVER:-unknown}\` |"
            echo "| KMI | \`${KMI:-unknown}\` |"
            echo "| Need WiFi fix (6.12) | \`${NEED_WIFI_FIX:-unknown}\` |"
            echo "| WiFi policy | \`${{ inputs.wifi_fix_mode }}\` |"
            echo "| WiFi safe (selected) | \`${WIFI_SAFE:-unknown}\` |"
            echo "| SUSFS selected | \`${SUSFS_KERNEL:-unknown}\` |"
            echo "| SUSFS final | \`${FINAL_SUSFS:-unknown}\` |"
            echo "| WiFi symbols final | \`${FINAL_WIFI:-unknown}\` |"
            echo "| Best URL | ${BEST_URL:-N/A} |"
            echo "| Best score | \`${BEST_SCORE:-N/A}\` |"
            if [ "${{ inputs.gki_source }}" = "zzh20188-ReSukiSU" ]; then
              echo "| ReSukiSU Spoofed APK found | \`${RESUKISU_SPOOFED_FOUND:-N/A}\` |"
            fi
            echo "| GoFile BOOT | ${GOFILE_LINK_BOOT:-N/A} |"
            echo "| GoFile AnyKernel3 | ${GOFILE_LINK_ANYKERNEL3:-N/A} |"
            echo "| GoFile Root Script | ${GOFILE_LINK_ROOT_SCRIPT:-N/A} |"
            echo "| GoFile SUSFS Module | ${GOFILE_LINK_SUSFS_MODULE:-N/A} |"
          } >> "$GITHUB_STEP_SUMMARY"
