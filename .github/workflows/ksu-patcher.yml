name: "KSU Boot Patcher - Multi Manager + SUSFS"

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: "Direct link to boot.img or firmware.zip"
        required: true
        type: string
      zip_boot_path:
        description: "Path to boot.img inside ZIP (empty = auto)"
        required: false
        type: string
      gki_source:
        description: "Kernel source"
        required: true
        default: "WildKernels"
        type: choice
        options:
          - "WildKernels"
          - "zzh20188"
          - "zzh20188-ReSukiSU"
          - "KernelSU-Next"
          - "Stock-Boot"
      require_exact_kver:
        description: "Require exact kernel version+android match"
        required: false
        type: boolean
        default: true
      include_susfs_module:
        description: "Download SUSFS userspace module"
        required: false
        type: boolean
        default: true
      include_zygisk:
        description: "Download ZygiskNext + Shamiko"
        required: false
        type: boolean
        default: false
      include_lsposed:
        description: "Download LSPosed"
        required: false
        type: boolean
        default: false

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Download input
        run: |
          set -e
          curl -L --progress-bar "${{ inputs.boot_img_url }}" -o input_file
          ls -lh input_file
          file input_file
          [ "$(stat -c%s input_file)" -ge 1000000 ] || { echo "::error::Input too small (< 1 MB)"; exit 1; }

      - name: Extract boot.img
        run: |
          set -e
          rm -rf ex
          mkdir -p ex

          if file input_file | grep -qiE 'zip|archive'; then
            if [ -n "${{ inputs.zip_boot_path }}" ]; then
              unzip -j input_file "${{ inputs.zip_boot_path }}" -d ex/ || { echo "::error::zip_boot_path not found"; exit 1; }
            else
              BOOT_PATH=$(unzip -l input_file | awk '{print $4}' \
                | grep -i 'boot\.img$' \
                | grep -ivE 'vendor_boot|init_boot|recovery|vbmeta|super' \
                | head -1 || true)
              if [ -z "$BOOT_PATH" ]; then
                BOOT_PATH=$(unzip -l input_file | awk '{print $4}' | grep -i '^boot' | head -1 || true)
              fi
              [ -n "$BOOT_PATH" ] || { echo "::error::Cannot auto-find boot.img"; exit 1; }
              unzip -j input_file "$BOOT_PATH" -d ex/
            fi

            IMG_FOUND=$(find ex -type f -name '*.img' | head -1 || true)
            [ -n "$IMG_FOUND" ] || { echo "::error::No .img extracted"; exit 1; }
            mv "$IMG_FOUND" boot.img
          else
            mv input_file boot.img
          fi

          file boot.img
          ls -lh boot.img

      - name: Setup dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y jq unzip curl xz-utils lz4

      - name: Setup magiskboot
        run: |
          set -e
          curl -sL "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -o magisk.apk || true
          if [ "$(stat -c%s magisk.apk 2>/dev/null || echo 0)" -lt 100000 ]; then
            APK=$(curl -sf https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
              | jq -r '.assets[] | select(.name | test("^Magisk-v[0-9].*\\.apk$")) | .browser_download_url' \
              | head -1)
            [ -n "$APK" ] && [ "$APK" != "null" ] || { echo "::error::Cannot find Magisk APK"; exit 1; }
            curl -sL "$APK" -o magisk.apk
          fi
          unzip -jq magisk.apk "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Unpack boot and detect kernel
        run: |
          set -e
          mkdir -p workspace out modules managers report candidates
          cp boot.img workspace/
          cd workspace
          ../magiskboot unpack boot.img

          KFILE=$(find . -maxdepth 1 \( -name kernel -o -name Image -o -name kernel.gz -o -name kernel_dtb -o -name kernel-dtb \) | head -1)
          [ -n "$KFILE" ] || { echo "::error::No kernel file found"; exit 1; }

          KTARGET="$KFILE"
          if file "$KFILE" | grep -qiE 'gzip|lz4|lzma|compressed'; then
            ../magiskboot decompress "$KFILE" kfile_dec 2>/dev/null || true
            [ -s kfile_dec ] && KTARGET="kfile_dec"
          fi

          FULL=$(strings "$KTARGET" 2>/dev/null | grep -oP 'Linux version \K[^\s]+' | head -1 || true)
          if [ -n "$FULL" ]; then
            KVER=$(echo "$FULL" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+' || true)
            KSHORT=$(echo "$FULL" | grep -oP '^[0-9]+\.[0-9]+' || true)
            ANDROID=$(echo "$FULL" | grep -oP 'android[0-9]+' | head -1 || true)
            KMI="${KSHORT}-${ANDROID}"
          else
            KVER="unknown"
            KSHORT="unknown"
            ANDROID="unknown"
            KMI="unknown"
          fi

          cd ..
          echo "KFILE=$KFILE" >> "$GITHUB_ENV"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KSHORT=$KSHORT" >> "$GITHUB_ENV"
          echo "ANDROID=$ANDROID" >> "$GITHUB_ENV"
          echo "KMI=$KMI" >> "$GITHUB_ENV"

          echo "Detected Kernel: KVER=$KVER, KSHORT=$KSHORT, ANDROID=$ANDROID, KMI=$KMI"

      - name: Select source config
        run: |
          set -e
          SOURCE="${{ inputs.gki_source }}"
          case "$SOURCE" in
            WildKernels)
              echo "SRC_REPO=WildKernels/GKI_KernelSU_SUSFS" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=false" >> "$GITHUB_ENV"
              echo "MGR1_REPO=WildKernels/Wild_KSU" >> "$GITHUB_ENV"
              echo "MGR1_NAME=WildKSU_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR2_NAME=KernelSU-Next_Manager" >> "$GITHUB_ENV"
              ;;
            zzh20188)
              echo "SRC_REPO=zzh20188/GKI_KernelSU_SUSFS" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=false" >> "$GITHUB_ENV"
              echo "MGR1_REPO=SukiSU-Ultra/SukiSU-Ultra" >> "$GITHUB_ENV"
              echo "MGR1_NAME=SukiSU_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR2_NAME=KernelSU-Next_Manager" >> "$GITHUB_ENV"
              ;;
            zzh20188-ReSukiSU)
              echo "SRC_REPO=zzh20188/GKI_KernelSU_SUSFS" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=true" >> "$GITHUB_ENV"
              echo "MGR1_REPO=" >> "$GITHUB_ENV"
              echo "MGR1_NAME=ReSukiSU_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=" >> "$GITHUB_ENV"
              echo "MGR2_NAME=" >> "$GITHUB_ENV"
              ;;
            KernelSU-Next|Stock-Boot)
              echo "SRC_REPO=" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=false" >> "$GITHUB_ENV"
              echo "MGR1_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR1_NAME=KernelSU-Next_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=" >> "$GITHUB_ENV"
              echo "MGR2_NAME=" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Prepare candidate list (smart latest by detected kernel)
        if: >
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'zzh20188-ReSukiSU'
        run: |
          set -e

          REPO="$SRC_REPO"
          USE_PRE="$SRC_USE_PRERELEASE"

          ALL_RELEASES=$(curl -sf "https://api.github.com/repos/${REPO}/releases?per_page=80")
          if [ "$USE_PRE" = "true" ]; then
            FILTERED=$(echo "$ALL_RELEASES" | jq 'map(select(.prerelease == true))')
          else
            FILTERED=$(echo "$ALL_RELEASES" | jq 'map(select(.prerelease == false))')
          fi

          [ "$(echo "$FILTERED" | jq 'length')" -gt 0 ] || { echo "::error::No releases found"; exit 1; }

          RELEASE_TAG=$(echo "$FILTERED" | jq -r '.[0].tag_name // "unknown"')
          RELEASE_DATE=$(echo "$FILTERED" | jq -r '.[0].created_at // empty')
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=${RELEASE_DATE:-}" >> "$GITHUB_ENV"

          echo "$FILTERED" | jq '
            [ .[]
              | . as $rel
              | $rel.assets[]?
              | {
                  name: .name,
                  url: .browser_download_url,
                  release_tag: $rel.tag_name,
                  published_at: ($rel.published_at // $rel.created_at)
                }
            ]
            | map(select((.name | ascii_downcase | contains("anykernel3")) and (.name | endswith(".zip"))))
          ' > candidates/assets_meta.json

          [ "$(jq 'length' candidates/assets_meta.json)" -gt 0 ] || { echo "::error::No AnyKernel3 assets found"; exit 1; }

          # Smart ranking: prefer exact KVER in file name, then same major.minor+android, then newest release date.
          jq -r --arg kv "$KVER" --arg ks "$KSHORT" --arg an "$(echo "$ANDROID" | tr '[:upper:]' '[:lower:]')" '
            map(
              . + {
                lname: (.name | ascii_downcase),
                rank: (
                  if (.name | contains($kv)) then 300
                  elif ((.name | contains($ks)) and ((.name | ascii_downcase | contains($an)) or ($an == ""))) then 200
                  elif (.name | contains($ks)) then 120
                  else 0
                  end
                )
              }
            )
            | map(. + {date_score: ((.published_at // "1970-01-01T00:00:00Z") | fromdateiso8601)})
            | sort_by([.rank, .date_score])
            | reverse
            | .[0:35]
            | .[]
            | .url
          ' candidates/assets_meta.json > candidates/urls.txt

          [ -s candidates/urls.txt ] || { echo "::error::No candidate URLs prepared"; exit 1; }
          echo "=== Top candidate URLs (ordered) ==="
          nl -ba candidates/urls.txt

      - name: Select best kernel candidate (prefer latest exact KVER)
        if: >
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'zzh20188-ReSukiSU'
        run: |
          set -e

          BEST_URL=""
          BEST_IMG=""
          BEST_SCORE=-1
          BEST_EXACT="no"
          BEST_SUSFS="no"
          i=0

          while IFS= read -r URL; do
            i=$((i+1))
            [ -n "$URL" ] || continue

            CZIP="candidates/cand_${i}.zip"
            CDIR="candidates/cand_${i}"
            OUTK="candidates/out_${i}.img"
            rm -rf "$CDIR"
            mkdir -p "$CDIR"

            echo "--- Candidate #$i ---"
            echo "URL: $URL"

            curl -L --progress-bar --connect-timeout 20 --max-time 240 "$URL" -o "$CZIP"
            [ -s "$CZIP" ] || { echo "empty download, skip"; continue; }

            unzip -q "$CZIP" -d "$CDIR" || { echo "unzip failed, skip"; continue; }
            CIMG=$(find "$CDIR" -type f \( -name Image -o -name Image.gz -o -name Image.lz4 -o -name kernel \) | head -1 || true)
            [ -n "$CIMG" ] || { echo "no kernel image, skip"; continue; }

            if file "$CIMG" | grep -qi gzip; then
              gunzip -c "$CIMG" > "$OUTK" || cp "$CIMG" "$OUTK"
            elif file "$CIMG" | grep -qi lz4; then
              ./magiskboot decompress "$CIMG" "$OUTK" 2>/dev/null || cp "$CIMG" "$OUTK"
            else
              cp "$CIMG" "$OUTK"
            fi
            [ -s "$OUTK" ] || { echo "failed to extract image, skip"; continue; }

            CKFULL=$(strings "$OUTK" 2>/dev/null | grep -oP 'Linux version \K[^\s]+' | head -1 || true)
            CKVER=$(echo "$CKFULL" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+' || true)
            CANDROID=$(echo "$CKFULL" | grep -oP 'android[0-9]+' | head -1 || true)

            HAS_EXACT="no"
            HAS_SUSFS="no"
            SCORE=0

            if [ -n "$CKVER" ] && [ -n "$CANDROID" ] && [ "$CKVER" = "$KVER" ] && [ "$CANDROID" = "$ANDROID" ]; then
              HAS_EXACT="yes"
              SCORE=$((SCORE+300))
            elif [ -n "$CKVER" ] && [ "$CKVER" = "$KVER" ]; then
              SCORE=$((SCORE+180))
            elif echo "$CKVER" | grep -q "^${KSHORT}"; then
              SCORE=$((SCORE+90))
            fi

            if strings "$OUTK" 2>/dev/null | grep -Eiq 'susfs|ksu_susfs|sus_su'; then
              HAS_SUSFS="yes"
              SCORE=$((SCORE+120))
            fi

            # Keep newer ordered candidates slightly preferred on ties.
            SCORE=$((SCORE + (50 - i)))

            echo "score=$SCORE exact=$HAS_EXACT susfs=$HAS_SUSFS ckver=${CKVER:-unknown} cand_android=${CANDROID:-unknown}"

            [ "$HAS_SUSFS" = "yes" ] || { echo "skip: SUSFS missing"; continue; }

            if [ "${{ inputs.require_exact_kver }}" = "true" ] && [ "$HAS_EXACT" != "yes" ]; then
              echo "skip: require_exact_kver=true and candidate is not exact"
              continue
            fi

            if [ "$SCORE" -gt "$BEST_SCORE" ]; then
              BEST_SCORE="$SCORE"
              BEST_URL="$URL"
              BEST_IMG="$OUTK"
              BEST_EXACT="$HAS_EXACT"
              BEST_SUSFS="$HAS_SUSFS"

              # Ordered list is newest-first. First exact+susfs hit is already latest for this KVER lane.
              if [ "$BEST_EXACT" = "yes" ] && [ "$BEST_SUSFS" = "yes" ]; then
                echo "early-stop: latest exact KVER candidate found"
                break
              fi
            fi
          done < candidates/urls.txt

          [ -n "$BEST_IMG" ] || { echo "::error::No valid kernel candidate found with SUSFS"; exit 1; }
          cp "$BEST_IMG" out/Image

          echo "BEST_URL=$BEST_URL" >> "$GITHUB_ENV"
          echo "BEST_SCORE=$BEST_SCORE" >> "$GITHUB_ENV"
          echo "SUSFS_KERNEL=$BEST_SUSFS" >> "$GITHUB_ENV"
          echo "KERNEL_EXACT_MATCH=$BEST_EXACT" >> "$GITHUB_ENV"

      - name: Repack with selected kernel
        if: >
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'zzh20188-ReSukiSU'
        run: |
          set -e
          [ -s out/Image ] || { echo "::error::out/Image missing"; exit 1; }
          KFILE_BASE=$(basename "$KFILE")
          cd workspace
          cp ../out/Image "$KFILE_BASE"
          ../magiskboot repack boot.img ../patched_boot.img
          cd ..
          [ -s patched_boot.img ] || { echo "::error::Failed to repack boot"; exit 1; }

      - name: Keep stock boot (no kernel replacement)
        if: >
          inputs.gki_source == 'KernelSU-Next' ||
          inputs.gki_source == 'Stock-Boot'
        run: |
          set -e
          cp boot.img patched_boot.img

      - name: Download manager APKs
        run: |
          set -e
          mkdir -p managers

          fetch_latest_apk() {
            local repo="$1"
            local out_name="$2"
            [ -n "$repo" ] || return 0

            local api="https://api.github.com/repos/${repo}/releases"
            local apk_url
            apk_url=$(curl -sf "$api" | jq -r '.[] | .assets[]? | select(.name | test("\\.apk$"; "i")) | .browser_download_url' | head -1)

            if [ -n "$apk_url" ] && [ "$apk_url" != "null" ]; then
              echo "Downloading ${out_name} from $apk_url"
              curl -L --progress-bar "$apk_url" -o "managers/${out_name}.apk" || true
            fi
          }

          fetch_latest_apk "$MGR1_REPO" "$MGR1_NAME"
          fetch_latest_apk "$MGR2_REPO" "$MGR2_NAME"

      - name: Download SUSFS module
        if: inputs.include_susfs_module == true
        run: |
          set -e
          mkdir -p modules

          SUSFS_REPO="sidex15/susfs4ksu-module"
          URL=$(curl -sf "https://api.github.com/repos/${SUSFS_REPO}/releases/latest" \
            | jq -r '.assets[]? | select(.name | test("\\.zip$"; "i")) | .browser_download_url' \
            | head -1)

          if [ -n "$URL" ] && [ "$URL" != "null" ]; then
            curl -L --progress-bar "$URL" -o modules/SUSFS_Module.zip
          else
            echo "SUSFS module release asset not found, skipping"
          fi

      - name: Download ZygiskNext + Shamiko
        if: inputs.include_zygisk == true
        run: |
          set -e
          mkdir -p modules

          ZN_URL=$(curl -sf "https://api.github.com/repos/Dr-TSNG/ZygiskNext/releases/latest" \
            | jq -r '.assets[]? | select(.name | test("\\.zip$"; "i")) | .browser_download_url' \
            | head -1)

          SHAMIKO_URL=$(curl -sf "https://api.github.com/repos/LSPosed/LSPosed.github.io/releases" \
            | jq -r '.[].assets[]? | select(.name | test("shamiko.*\\.zip$"; "i")) | .browser_download_url' \
            | head -1)

          [ -z "$ZN_URL" ] || [ "$ZN_URL" = "null" ] || curl -L --progress-bar "$ZN_URL" -o modules/ZygiskNext.zip
          [ -z "$SHAMIKO_URL" ] || [ "$SHAMIKO_URL" = "null" ] || curl -L --progress-bar "$SHAMIKO_URL" -o modules/Shamiko.zip

      - name: Download LSPosed
        if: inputs.include_lsposed == true
        run: |
          set -e
          mkdir -p modules

          URL=$(curl -sf "https://api.github.com/repos/LSPosed/LSPosed/releases/latest" \
            | jq -r '.assets[]? | select(.name | test("\\.zip$"; "i")) | .browser_download_url' \
            | head -1)

          [ -z "$URL" ] || [ "$URL" = "null" ] || curl -L --progress-bar "$URL" -o modules/LSPosed.zip

      - name: Build report
        run: |
          set -e
          mkdir -p report
          {
            echo "Kernel source: ${{ inputs.gki_source }}"
            echo "Detected KVER: ${KVER}"
            echo "Detected KSHORT: ${KSHORT}"
            echo "Detected ANDROID: ${ANDROID}"
            echo "Require exact match: ${{ inputs.require_exact_kver }}"
            echo "Selected candidate URL: ${BEST_URL:-N/A}"
            echo "Selected candidate score: ${BEST_SCORE:-N/A}"
            echo "Kernel exact match: ${KERNEL_EXACT_MATCH:-N/A}"
            echo "SUSFS kernel check: ${SUSFS_KERNEL:-N/A}"
          } > report/summary.txt

          ls -lh patched_boot.img
          cp patched_boot.img report/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KSU_Boot_Patcher_Output
          path: |
            patched_boot.img
            managers/
            modules/
            report/
          if-no-files-found: warn
