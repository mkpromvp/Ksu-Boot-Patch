name: "KSU Boot Patcher - Multi Manager + SUSFS"

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: "Direct link to boot.img or firmware.zip"
        required: true
        type: string
      zip_boot_path:
        description: "Path to boot.img inside ZIP (empty = auto)"
        required: false
        type: string
      gki_source:
        description: "Kernel source"
        required: true
        default: "WildKernels"
        type: choice
        options:
          - "WildKernels"
          - "zzh20188"
          - "zzh20188-ReSukiSU"
          - "KernelSU-Next"
          - "Stock-Boot"
      require_exact_kver:
        description: "Require exact kernel version+android match"
        required: false
        type: boolean
        default: true
      include_susfs_module:
        description: "Download SUSFS userspace module"
        required: false
        type: boolean
        default: true
      include_zygisk:
        description: "Download ZygiskNext + Shamiko"
        required: false
        type: boolean
        default: false
      include_lsposed:
        description: "Download LSPosed"
        required: false
        type: boolean
        default: false

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Download input
        run: |
          set -euo pipefail
          curl -L --progress-bar "${{ inputs.boot_img_url }}" -o input_file
          ls -lh input_file
          file input_file
          [ "$(stat -c%s input_file)" -ge 1000000 ] || { echo "::error::Input too small (< 1 MB)"; exit 1; }

      - name: Extract boot.img
        run: |
          set -euo pipefail
          rm -rf ex
          mkdir -p ex

          if file input_file | grep -qiE 'zip|archive'; then
            if [ -n "${{ inputs.zip_boot_path }}" ]; then
              unzip -j input_file "${{ inputs.zip_boot_path }}" -d ex/ || { echo "::error::zip_boot_path not found"; exit 1; }
            else
              BOOT_PATH=$(unzip -l input_file | awk '{print $4}' \
                | grep -i 'boot\.img$' \
                | grep -ivE 'vendor_boot|init_boot|recovery|vbmeta|super' \
                | head -1 || true)
              if [ -z "${BOOT_PATH:-}" ]; then
                BOOT_PATH=$(unzip -l input_file | awk '{print $4}' | grep -i '^boot' | head -1 || true)
              fi
              [ -n "${BOOT_PATH:-}" ] || { echo "::error::Cannot auto-find boot.img"; exit 1; }
              unzip -j input_file "$BOOT_PATH" -d ex/
            fi

            IMG_FOUND=$(find ex -type f -name '*.img' | head -1 || true)
            [ -n "${IMG_FOUND:-}" ] || { echo "::error::No .img extracted"; exit 1; }
            mv "$IMG_FOUND" boot.img
          else
            mv input_file boot.img
          fi

          file boot.img
          ls -lh boot.img

      - name: Setup magiskboot
        run: |
          set -euo pipefail
          curl -sL "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -o magisk.apk || true
          if [ "$(stat -c%s magisk.apk 2>/dev/null || echo 0)" -lt 100000 ]; then
            APK=$(curl -sf https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
              | jq -r '.assets[] | select(.name | test("^Magisk-v[0-9].*\\.apk$")) | .browser_download_url' \
              | head -1)
            [ -n "${APK:-}" ] && [ "$APK" != "null" ] || { echo "::error::Cannot find Magisk APK"; exit 1; }
            curl -sL "$APK" -o magisk.apk
          fi
          unzip -jq magisk.apk "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Unpack boot and detect kernel
        run: |
          set -euo pipefail
          mkdir -p workspace out modules managers report candidates
          cp boot.img workspace/
          cd workspace
          ../magiskboot unpack boot.img

          KFILE=$(find . -maxdepth 1 \( -name kernel -o -name Image -o -name kernel.gz -o -name kernel_dtb -o -name kernel-dtb \) | head -1)
          [ -n "${KFILE:-}" ] || { echo "::error::No kernel file found"; exit 1; }

          KTARGET="$KFILE"
          if file "$KFILE" | grep -qiE 'gzip|lz4|lzma|compressed'; then
            ../magiskboot decompress "$KFILE" kfile_dec 2>/dev/null || true
            [ -s kfile_dec ] && KTARGET="kfile_dec"
          fi

          FULL=$(strings "$KTARGET" 2>/dev/null | grep -oP 'Linux version \K[^\s]+' | head -1 || true)
          if [ -n "${FULL:-}" ]; then
            KVER=$(echo "$FULL" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+' || true)
            KSHORT=$(echo "$FULL" | grep -oP '^[0-9]+\.[0-9]+' || true)
            ANDROID=$(echo "$FULL" | grep -oP 'android[0-9]+' | head -1 || true)
            KMI="${KSHORT}-${ANDROID}"
          else
            KVER="unknown"
            KSHORT="unknown"
            ANDROID="unknown"
            KMI="unknown"
          fi

          cd ..
          echo "KFILE=$KFILE" >> "$GITHUB_ENV"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KSHORT=$KSHORT" >> "$GITHUB_ENV"
          echo "ANDROID=$ANDROID" >> "$GITHUB_ENV"
          echo "KMI=$KMI" >> "$GITHUB_ENV"

          echo "Detected Kernel: KVER=$KVER, KSHORT=$KSHORT, ANDROID=$ANDROID, KMI=$KMI"

      - name: Select source config
        run: |
          set -euo pipefail
          SOURCE="${{ inputs.gki_source }}"
          case "$SOURCE" in
            WildKernels)
              echo "SRC_REPO=WildKernels/GKI_KernelSU_SUSFS" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=false" >> "$GITHUB_ENV"
              echo "MGR1_REPO=WildKernels/Wild_KSU" >> "$GITHUB_ENV"
              echo "MGR1_NAME=WildKSU_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR2_NAME=KernelSU-Next_Manager" >> "$GITHUB_ENV"
              ;;
            zzh20188)
              echo "SRC_REPO=zzh20188/GKI_KernelSU_SUSFS" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=false" >> "$GITHUB_ENV"
              echo "MGR1_REPO=SukiSU-Ultra/SukiSU-Ultra" >> "$GITHUB_ENV"
              echo "MGR1_NAME=SukiSU_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR2_NAME=KernelSU-Next_Manager" >> "$GITHUB_ENV"
              ;;
            zzh20188-ReSukiSU)
              echo "SRC_REPO=zzh20188/GKI_KernelSU_SUSFS" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=true" >> "$GITHUB_ENV"
              echo "MGR1_REPO=" >> "$GITHUB_ENV"
              echo "MGR1_NAME=ReSukiSU_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=" >> "$GITHUB_ENV"
              echo "MGR2_NAME=" >> "$GITHUB_ENV"
              ;;
            KernelSU-Next|Stock-Boot)
              echo "SRC_REPO=" >> "$GITHUB_ENV"
              echo "SRC_USE_PRERELEASE=false" >> "$GITHUB_ENV"
              echo "MGR1_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR1_NAME=KernelSU-Next_Manager" >> "$GITHUB_ENV"
              echo "MGR2_REPO=" >> "$GITHUB_ENV"
              echo "MGR2_NAME=" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Prepare candidate list (universal GKI search)
        if: >
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'zzh20188-ReSukiSU'
        run: |
          set -euo pipefail

          REPO="$SRC_REPO"
          USE_PRE="$SRC_USE_PRERELEASE"

          fetch_url() {
            local url="$1"
            local body=""

            if [ -n "${GITHUB_TOKEN:-}" ]; then
              body=$(curl --http1.1 -sSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 \
                -H "Accept: application/vnd.github+json" \
                -H "User-Agent: ksu-boot-patcher" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                "$url" || true)
            else
              body=$(curl --http1.1 -sSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 \
                -H "Accept: application/vnd.github+json" \
                -H "User-Agent: ksu-boot-patcher" \
                "$url" || true)
            fi

            if [ -z "${body:-}" ]; then
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                body=$(wget -qO- --timeout=120 --tries=2 \
                  --header="Accept: application/vnd.github+json" \
                  --header="User-Agent: ksu-boot-patcher" \
                  --header="Authorization: Bearer ${GITHUB_TOKEN}" \
                  "$url" || true)
              else
                body=$(wget -qO- --timeout=120 --tries=2 \
                  --header="Accept: application/vnd.github+json" \
                  --header="User-Agent: ksu-boot-patcher" \
                  "$url" || true)
              fi
            fi

            echo "$body"
          }

          github_api_get_json_array() {
            local url="$1"
            local attempt
            local body
            for attempt in 1 2 3 4 5; do
              body=$(fetch_url "$url")

              if echo "$body" | jq -e 'type == "array"' >/dev/null 2>&1; then
                echo "$body"
                return 0
              fi

              echo "warn: non-json/invalid API response on attempt $attempt for $url" >&2
              sleep $((attempt * 2))
            done
            return 1
          }

          collect_release_urls_from_html() {
            local page
            local html
            local found=0
            : > candidates/urls_html_raw.txt

            for page in 1 2 3 4 5; do
              html=$(curl --http1.1 -sSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
                -H "User-Agent: ksu-boot-patcher" \
                "https://github.com/${REPO}/releases?page=${page}" || true)
              if [ -z "${html:-}" ]; then
                html=$(wget -qO- --timeout=120 --tries=2 \
                  --header="User-Agent: ksu-boot-patcher" \
                  "https://github.com/${REPO}/releases?page=${page}" || true)
              fi
              [ -n "${html:-}" ] || continue

              echo "$html" \
                | tr '"' '\n' \
                | grep "/${REPO}/releases/download/" \
                | grep -Ei '\.zip($|\?)' \
                | awk '{print "https://github.com" $0}' >> candidates/urls_html_raw.txt || true
            done

            if [ -s candidates/urls_html_raw.txt ]; then
              awk 'NF' candidates/urls_html_raw.txt \
                | sed 's/amp;//g' \
                | grep -Ei 'anykernel3.*\.zip|\.zip.*anykernel3' \
                | awk '!seen[$0]++' > candidates/urls.txt || true
              [ -s candidates/urls.txt ] && found=1
            fi

            [ "$found" -eq 1 ]
          }

          rm -f releases_all.json
          touch releases_all.json

          API_OK="yes"
          for PAGE in 1 2 3; do
            if ! RESP=$(github_api_get_json_array "https://api.github.com/repos/${REPO}/releases?per_page=100&page=${PAGE}"); then
              API_OK="no"
              break
            fi
            [ -n "${RESP:-}" ] || { API_OK="no"; break; }
            COUNT=$(echo "$RESP" | jq 'length')
            [ "$COUNT" -gt 0 ] || break
            if [ ! -s releases_all.json ] || [ "$(cat releases_all.json)" = "" ]; then
              echo "$RESP" > releases_all.json
            else
              jq -s '.[0] + .[1]' releases_all.json <(echo "$RESP") > releases_merge.json
              mv releases_merge.json releases_all.json
            fi
          done

          if [ "$API_OK" = "yes" ] && [ -s releases_all.json ] && jq -e 'type == "array"' releases_all.json >/dev/null 2>&1; then
            if [ "$USE_PRE" = "true" ]; then
              jq 'map(select(.prerelease == true))' releases_all.json > releases_filtered.json
            else
              jq 'map(select(.prerelease == false))' releases_all.json > releases_filtered.json
            fi

            if [ "$(jq 'length' releases_filtered.json)" -gt 0 ]; then
              jq '
                [ .[]
                  | . as $rel
                  | ($rel.assets // [])[]?
                  | select(.name and .browser_download_url)
                  | {
                      name: .name,
                      url: .browser_download_url,
                      release_tag: ($rel.tag_name // "unknown"),
                      published_at: ($rel.published_at // $rel.created_at // "1970-01-01T00:00:00Z")
                    }
                ]
                | map(select((.name | ascii_downcase | contains("anykernel3")) and (.name | endswith(".zip"))))
              ' releases_filtered.json > candidates/assets_meta.json
            else
              echo '[]' > candidates/assets_meta.json
            fi

            if [ "$(jq 'length' candidates/assets_meta.json)" -gt 0 ]; then
              jq --arg kv "$KVER" --arg ks "$KSHORT" --arg an "$(echo "$ANDROID" | tr '[:upper:]' '[:lower:]')" '
                map(
                  . + {
                    lname: (.name | ascii_downcase),
                    rank: (
                      (if ($kv != "" and $kv != "unknown" and (.name | contains($kv))) then 320 else 0 end)
                      + (if ($ks != "" and $ks != "unknown" and (.name | contains($ks))) then 130 else 0 end)
                      + (if ($an != "" and $an != "unknown" and (.name | ascii_downcase | contains($an))) then 120 else 0 end)
                      + (if (.name | ascii_downcase | contains("gki")) then 40 else 0 end)
                      + (if (.name | ascii_downcase | contains("bypass")) then 15 else 0 end)
                    ),
                    date_score: ((.published_at | fromdateiso8601?) // 0)
                  }
                )
                | sort_by([.rank, .date_score])
                | reverse
                | .[0:60]
              ' candidates/assets_meta.json > candidates/assets_ranked.json

              jq -r '.[].url' candidates/assets_ranked.json | awk 'NF' | awk '!seen[$0]++' > candidates/urls.txt

              RELEASE_TAG=$(jq -r '.[0].release_tag // "unknown"' candidates/assets_ranked.json)
              echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
              echo "MATCH_MODE=universal-gki-api" >> "$GITHUB_ENV"
            fi
          fi

          if [ ! -s candidates/urls.txt ]; then
            echo "warn: API path unavailable, trying HTML fallback..."
            if collect_release_urls_from_html; then
              echo "RELEASE_TAG=unknown" >> "$GITHUB_ENV"
              echo "MATCH_MODE=html-fallback" >> "$GITHUB_ENV"
            fi
          fi

          [ -s candidates/urls.txt ] || { echo "::error::No candidate URLs prepared from API or HTML fallback"; exit 1; }

          echo "=== Top candidate URLs (ordered) ==="
          nl -ba candidates/urls.txt

      - name: Select best kernel candidate (SUSFS-first scoring)
        if: >
          inputs.gki_source == 'WildKernels' ||
          inputs.gki_source == 'zzh20188' ||
          inputs.gki_source == 'zzh20188-ReSukiSU'
        run: |
          set -euo pipefail

          BEST_SCORE=-1
          BEST_URL=""
          BEST_IMG=""
          BEST_SUSFS="no"
          BEST_BYPASS="no"
          BEST_EXACT="no"
          BEST_SUSFS_NEW="no"
          i=0

          while IFS= read -r URL; do
            i=$((i + 1))
            [ -n "${URL:-}" ] || continue

            URL_L=$(echo "$URL" | tr '[:upper:]' '[:lower:]')

            CZIP="candidates/cand_${i}.zip"
            CDIR="candidates/cand_${i}"

            rm -rf "$CDIR"
            mkdir -p "$CDIR"

            echo "--- Candidate #$i ---"
            echo "URL: $URL"
            curl -L --progress-bar --connect-timeout 20 --max-time 240 "$URL" -o "$CZIP"
            [ -s "$CZIP" ] || { echo "empty download, skip"; continue; }

            unzip -q "$CZIP" -d "$CDIR" || { echo "unzip failed, skip"; continue; }

            CIMG=$(find "$CDIR" -type f \( -name Image -o -name Image.gz -o -name Image.lz4 -o -name kernel \) | head -1 || true)
            [ -n "${CIMG:-}" ] || { echo "no kernel image, skip"; continue; }

            OUTK="candidates/out_${i}.img"
            if file "$CIMG" | grep -qi gzip; then
              gunzip -c "$CIMG" > "$OUTK" || cp "$CIMG" "$OUTK"
            elif file "$CIMG" | grep -qi lz4; then
              ./magiskboot decompress "$CIMG" "$OUTK" 2>/dev/null || cp "$CIMG" "$OUTK"
            else
              cp "$CIMG" "$OUTK"
            fi
            [ -s "$OUTK" ] || { echo "failed to extract image, skip"; continue; }

            SCORE=0
            HAS_SUSFS="no"
            HAS_BYPASS="no"
            HAS_EXACT="no"
            HAS_SUSFS_NEW="no"

            CKFULL=$(strings "$OUTK" 2>/dev/null | grep -oP 'Linux version \K[^\s]+' | head -1 || true)
            CKVER=$(echo "$CKFULL" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+' || true)
            CANDROID=$(echo "$CKFULL" | grep -oP 'android[0-9]+' | head -1 || true)
            if [ -n "${CKVER:-}" ] && [ -n "${CANDROID:-}" ] && [ "$CKVER" = "$KVER" ] && [ "$CANDROID" = "$ANDROID" ]; then
              HAS_EXACT="yes"
              SCORE=$((SCORE + 120))
            elif [ -n "${CKVER:-}" ] && [ -n "${CANDROID:-}" ] && [ "$CANDROID" = "$ANDROID" ] && echo "$CKVER" | grep -q "^${KSHORT}"; then
              SCORE=$((SCORE + 45))
            fi

            if strings "$OUTK" 2>/dev/null | grep -Eiq 'susfs|ksu_susfs|sus_su'; then
              HAS_SUSFS="yes"
              SCORE=$((SCORE + 80))
            fi

            if strings "$OUTK" 2>/dev/null | grep -Eiq 'susfs[^[:alnum:]]*v?(2\.[1-9]|[3-9]\.)|susfs v2\.[1-9]'; then
              HAS_SUSFS_NEW="yes"
              SCORE=$((SCORE + 20))
            fi

            if echo "$URL_L" | grep -qiE 'bypass'; then
              HAS_BYPASS="yes"
              SCORE=$((SCORE + 40))
            fi

            if echo "$URL" | grep -qi "$KVER"; then
              SCORE=$((SCORE + 20))
            elif echo "$URL" | grep -qi "$KSHORT"; then
              SCORE=$((SCORE + 10))
            fi

            if [ "${{ inputs.gki_source }}" = "zzh20188-ReSukiSU" ] && echo "$URL_L" | grep -Eiq 'resukisu|sukisu'; then
              SCORE=$((SCORE + 10))
            fi

            if echo "$URL_L" | grep -qiE 'exp|experimental'; then
              SCORE=$((SCORE - 15))
            fi

            echo "score=$SCORE susfs=$HAS_SUSFS susfs_new=$HAS_SUSFS_NEW bypass=$HAS_BYPASS exact=$HAS_EXACT ckver=${CKVER:-unknown}"

            if [ "$HAS_SUSFS" != "yes" ]; then
              echo "skip: SUSFS missing"
              continue
            fi

            if [ "${{ inputs.require_exact_kver }}" = "true" ] && [ "$HAS_EXACT" != "yes" ]; then
              echo "skip: require_exact_kver=true and candidate is not exact ($CKVER/$CANDROID vs $KVER/$ANDROID)"
              continue
            fi

            if [ "$SCORE" -gt "$BEST_SCORE" ]; then
              BEST_SCORE="$SCORE"
              BEST_URL="$URL"
              BEST_IMG="$OUTK"
              BEST_SUSFS="$HAS_SUSFS"
              BEST_BYPASS="$HAS_BYPASS"
              BEST_EXACT="$HAS_EXACT"
              BEST_SUSFS_NEW="$HAS_SUSFS_NEW"

              if [ "$BEST_EXACT" = "yes" ] && [ "$BEST_SUSFS" = "yes" ] && [ "$BEST_SCORE" -ge 220 ]; then
                echo "early-stop: high confidence candidate found"
                break
              fi
            fi
          done < candidates/urls.txt

          [ -n "${BEST_IMG:-}" ] || { echo "::error::No valid kernel candidate found with SUSFS"; exit 1; }
          cp "$BEST_IMG" out/Image

          echo "BEST_URL=$BEST_URL" >> "$GITHUB_ENV"
          echo "BEST_SCORE=$BEST_SCORE" >> "$GITHUB_ENV"
          echo "SUSFS_KERNEL=$BEST_SUSFS" >> "$GITHUB_ENV"
          echo "SUSFS_NEW_HINT=$BEST_SUSFS_NEW" >> "$GITHUB_ENV"
          echo "BYPASS_BUILD=$BEST_BYPASS" >> "$GITHUB_ENV"
          echo "KERNEL_EXACT_MATCH=$BEST_EXACT" >> "$GITHUB_ENV"

          echo "Selected candidate: $BEST_URL"
          echo "score=$BEST_SCORE susfs=$BEST_SUSFS susfs_new=$BEST_SUSFS_NEW bypass=$BEST_BYPASS exact=$BEST_EXACT"

      - name: Build patched boot image
        run: |
          set -euo pipefail
          if [ "${{ inputs.gki_source }}" = "WildKernels" ] || [ "${{ inputs.gki_source }}" = "zzh20188" ] || [ "${{ inputs.gki_source }}" = "zzh20188-ReSukiSU" ]; then
            [ -s out/Image ] || { echo "::error::out/Image missing"; exit 1; }
            KFILE_BASE=$(basename "$KFILE")
            cd workspace
            cp ../out/Image "$KFILE_BASE"
            ../magiskboot repack boot.img ../patched_boot.img
            cd ..
          else
            cp boot.img patched_boot.img
          fi

          [ -s patched_boot.img ] || { echo "::error::patched_boot.img missing"; exit 1; }
          ls -lh patched_boot.img

      - name: Download manager and optional modules
        run: |
          set -euo pipefail

          fetch_latest_asset() {
            local repo="$1"
            local regex="$2"
            local out="$3"
            [ -n "${repo:-}" ] || return 0

            URL=$(curl -sf "https://api.github.com/repos/${repo}/releases/latest" \
              | jq -r --arg re "$regex" '.assets[] | select(.name | test($re; "i")) | .browser_download_url' \
              | head -1 || true)
            if [ -n "${URL:-}" ] && [ "$URL" != "null" ]; then
              echo "Downloading $out from $repo"
              curl -L --progress-bar "$URL" -o "$out" || true
            fi
          }

          mkdir -p managers modules

          fetch_latest_asset "$MGR1_REPO" "\\.apk$" "managers/${MGR1_NAME:-manager1}.apk"
          fetch_latest_asset "$MGR2_REPO" "\\.apk$" "managers/${MGR2_NAME:-manager2}.apk"

          if [ "${{ inputs.include_susfs_module }}" = "true" ]; then
            fetch_latest_asset "sidex15/susfs4ksu-module" "\\.zip$" "modules/SUSFS_Module.zip"
          fi

          if [ "${{ inputs.include_zygisk }}" = "true" ]; then
            fetch_latest_asset "Dr-TSNG/ZygiskNext" "\\.zip$" "modules/ZygiskNext.zip"
            fetch_latest_asset "LSPosed/LSPosed.github.io" "Shamiko.*\\.zip$" "modules/Shamiko.zip"
          fi

          if [ "${{ inputs.include_lsposed }}" = "true" ]; then
            fetch_latest_asset "LSPosed/LSPosed" "(zygisk|release).*(\\.zip|\\.apk)$" "modules/LSPosed.pkg"
          fi

      - name: Create report
        run: |
          set -euo pipefail
          {
            echo "KSU Boot Patcher Report"
            echo "======================="
            echo "Source: ${{ inputs.gki_source }}"
            echo "Detected KVER: ${KVER:-unknown}"
            echo "Detected KSHORT: ${KSHORT:-unknown}"
            echo "Detected ANDROID: ${ANDROID:-unknown}"
            echo "Detected KMI: ${KMI:-unknown}"
            echo "Release Tag: ${RELEASE_TAG:-n/a}"
            echo "Match Mode: ${MATCH_MODE:-n/a}"
            echo "Best Candidate URL: ${BEST_URL:-n/a}"
            echo "Best Score: ${BEST_SCORE:-n/a}"
            echo "SUSFS Present: ${SUSFS_KERNEL:-n/a}"
            echo "SUSFS New Hint: ${SUSFS_NEW_HINT:-n/a}"
            echo "Exact Kernel Match: ${KERNEL_EXACT_MATCH:-n/a}"
            echo "Bypass Build: ${BYPASS_BUILD:-n/a}"
          } > report/summary.txt

          cp patched_boot.img report/
          ls -lah report

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu_patched_output
          path: |
            patched_boot.img
            report/summary.txt
            managers/*
            modules/*
          if-no-files-found: warn
